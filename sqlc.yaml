version: "2"
sql:
  - engine: sqlite
    schema: [internal/persistence/sqlite/sql/catalog.sql, internal/persistence/sqlite/sql/schema.sql, internal/persistence/sqlite/sql/connections_schema.sql, internal/persistence/sqlite/sql/sync_schema.sql, internal/persistence/sqlite/sql/recovery_schema.sql]
    queries: [internal/persistence/sqlite/sql/queries.sql, internal/persistence/sqlite/sql/admin_queries.sql]
    gen:
      go:
        package: sqlc
        out: internal/persistence/sqlite/sqlc
        sql_package: database/sql
        emit_interface: true
