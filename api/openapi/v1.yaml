openapi: 3.0.3
info:
  title: Wake accepted financial model
  version: 1.0.0
  description: GET-only HTTP over TCP, authenticated by an independently revocable client token. GET
    /v1/snapshot returns the complete accepted resource set, warehouse identity and an opaque publication
    version. GET /v1/events streams coalesced publication notifications; reconnect announces current state.
    Compare versions for equality only. ETag and If-None-Match support unchanged conditional
    reads. Each finite response is materialized from one consistent read, released before client I/O. Validate
    the complete response before atomically replacing a mirror and its version. Failed downloads or writes
    preserve the previous mirror. A different warehouse installs a clearly reported new baseline. Individual
    resource lookups and revision-bound explanations remain available; a changed explanation revision
    returns stale_revision. Current-state synchronization does not retain intermediate delivery transitions.
    Retired instrument/listing lookups redirect to their current IDs; explanations for retired IDs
    return stale_revision. Instrument resources describe identity; financial terms belong to activity.
    Reported account positions have a separate versioned read and positions events, and are excluded
    from the financial snapshot. An unavailable value in a selected variant is explicit null, distinct from decimal zero. Unknown or duplicate parameters and
    mutation methods are rejected. During a retained-history update, affected reads and event connections return 503 history_updating.
    Preserve the last complete mirror and retry with backoff. Account-only reads remain available.
    Raw evidence, credentials and operational interfaces are excluded. Tokens grant no administrative authority.
    Revocation rejects new requests and cancels active streams; blocked stream writes time out within five seconds.
    Each client may hold eight concurrent requests, with 64 across the instance. Excess requests return 503.
    The deployment chooses transport protection. Direct HTTP provides no confidentiality; use SSH or HTTPS
    when the network path needs encryption.
security:
  - clientToken: []
paths:
  /v1/events:
    get:
      operationId: publicationEvents
      description: |
        Long-lived SSE notifications of independently versioned financial views. The server subscribes before
        its initial metadata read. A publication event is sent immediately and after accepted changes;
        bursts may coalesce. JSON data contains warehouse_id and the opaque snapshot version.
        Compare versions for equality only. An event is a refresh hint, never an acknowledgement
        that the client has synchronized. Fetch and validate a snapshot before committing a mirror
        and its version. A fetched snapshot may already be newer than the notification.
        Reconnects announce current publication; intermediate transitions are not replayed.
        No SSE id fields are sent; Last-Event-ID is ignored and provides no replay semantics.
        Comment heartbeats are sent every 15 seconds without reading storage. Consumers should
        detect absent heartbeats and reconnect with bounded backoff. Stream errors after headers
        close the connection. Disconnect and daemon shutdown release the subscription.
        A separate event: positions carries a PositionsPublication object for each account's
        positions view. Current positions metadata is announced on connection/reconnect, including
        unavailable views; changes to position content or availability produce refresh hints.
        Positions-only changes do not emit publication events. Shared identity changes may affect
        both views. Each event type has its own version; never compare versions across views.
        Consumers uninterested in an event type ignore it. Positions hints have the same coalescing,
        heartbeat and no-replay semantics. Fetch positions conditionally before acknowledging its
        version; a response may already be newer than the hint.
        No query parameters or request body are accepted.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: |
            UTF-8 SSE frames: event: publication followed by data: containing a Publication
            JSON object and a blank line. Colon-prefixed comment frames are heartbeats.
          content:
            text/event-stream:
              schema:
                type: string
              example: "event: publication\ndata: {\"warehouse_id\":\"warehouse\",\"version\":\"opaque-version\"}\n\n"
        '400':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/Error'
  /v1/accounts/{id}/positions:
    get:
      operationId: accountPositions
      description: |
        Latest accepted reported position set for one account, independently versioned and excluded
        from the financial snapshot. One effective time applies to the entire set. Date-only evidence
        has a null timestamp. Quantities are signed (positive long, negative short); unit cost basis is reported
        in its original currency. No holdings or cost reconstruction is performed.
        An available empty set is []; unavailable rows are null with an explicit reason. Newer
        unusable evidence withholds the set without falling back to older positions. Acquisition
        failures alone do not erase established state. Source generation/retrieval times do not
        establish revision authority. Resolve instrument IDs through the existing resource lookups.
        The opaque version is scoped to this warehouse and account. Compare for equality only;
        ETag/If-None-Match apply to available and unavailable views. Unknown/duplicate parameters,
        request bodies and mutation methods are rejected. Reads are materialized before client I/O.
      parameters:
      - $ref: '#/components/parameters/id'
      - in: header
        name: If-None-Match
        schema:
          type: string
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Current available or unavailable position view
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionsView'
        '304':
          description: This account's positions view is unchanged
          headers:
            ETag:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/Error'
  /v1/accounts/{id}:
    get:
      operationId: getAccounts
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/accounts/{id}/explanation:
    get:
      operationId: explainAccounts
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/revision'
      responses:
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/instruments/{id}:
    get:
      operationId: getInstruments
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '308':
          description: Retired identity; follow Location to the current resource. No old explanation revision is transferred.
          headers:
            Location:
              required: true
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/Error'
  /v1/instruments/{id}/explanation:
    get:
      operationId: explainInstruments
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/revision'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/Error'
  /v1/listings/{id}:
    get:
      operationId: getListings
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '308':
          description: Retired identity; follow Location to the current resource. No old explanation revision is transferred.
          headers:
            Location:
              required: true
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/Error'
  /v1/listings/{id}/explanation:
    get:
      operationId: explainListings
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/revision'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/Error'
  /v1/activity/{id}:
    get:
      operationId: getActivity
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/Error'
  /v1/activity/{id}/explanation:
    get:
      operationId: explainActivity
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/revision'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/Error'
  /v1/snapshot:
    get:
      operationId: snapshot
      description: One consistent complete accepted resource set. Transactions are released before client
        I/O. Version is opaque and scoped to the warehouse identity.
      parameters:
      - in: header
        name: If-None-Match
        schema:
          type: string
        description: A previous ETag; weak validators and lists are supported.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Complete accepted state
          headers:
            ETag:
              schema:
                type: string
              description: Quoted opaque publication version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialSnapshot'
        '304':
          description: Accepted state is unchanged
          headers:
            ETag:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    clientToken:
      type: http
      scheme: bearer
      description: Opaque per-client token. Send only in the Authorization header, including for event streams.
  schemas:
    Decimal:
      type: string
      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
      maxLength: 256
    CurrencyCode:
      type: string
      pattern: ^[A-Z]{3}$
    CivilDate:
      type: string
      format: date
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      x-go-type: string
    Timestamp:
      type: string
      format: date-time
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$
      x-go-type: string
    QuotationBasis:
      type: string
      enum:
      - per_share
      - per_underlying_unit
    NullableDecimal:
      type: string
      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
      maxLength: 256
      nullable: true
    NullableCurrencyCode:
      type: string
      pattern: ^[A-Z]{3}$
      nullable: true
    NullableCivilDate:
      type: string
      format: date
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      x-go-type: string
      nullable: true
    NullableTimestamp:
      type: string
      format: date-time
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$
      x-go-type: string
      nullable: true
    NullableQuotationBasis:
      type: string
      enum:
      - per_share
      - per_underlying_unit
      - null
      nullable: true
    PositionsPublication:
      type: object
      additionalProperties: false
      required: [warehouse_id, account_id, version]
      properties:
        warehouse_id:
          type: string
          minLength: 1
        account_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
    Position:
      type: object
      additionalProperties: false
      required:
      - instrument_id
      - quantity
      - side
      - unit_cost_basis
      - instrument_terms
      properties:
        instrument_id:
          type: string
          minLength: 1
        quantity:
          allOf:
          - $ref: '#/components/schemas/Quantity'
          description: Unit is shares, contracts, nominal, or units. The units value preserves a reported quantity
            for an unclassified instrument or for debt with unspecified face amount.
        side:
          type: string
          enum:
          - long
          - short
        unit_cost_basis:
          $ref: '#/components/schemas/NullableUnitCostBasis'
        instrument_terms:
          $ref: '#/components/schemas/InstrumentTerms'
    NullableUnitCostBasis:
      type: object
      additionalProperties: false
      required:
      - amount
      - currency
      - quotation_basis
      properties:
        amount:
          $ref: '#/components/schemas/Decimal'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        quotation_basis:
          $ref: '#/components/schemas/NullableQuotationBasis'
      nullable: true
      description: Reported unit cost basis in the original currency.
    PositionsView:
      type: object
      additionalProperties: false
      required: [warehouse_id, account_id, version, status, as_of, reason, positions]
      oneOf:
      - type: object
        properties:
          status:
            type: string
            enum: [available]
          as_of:
            type: object
          reason:
            type: string
            nullable: true
            enum: [null]
          positions:
            type: array
            items:
              $ref: '#/components/schemas/Position'
      - type: object
        properties:
          status:
            type: string
            enum: [unavailable]
          reason:
            type: string
          positions:
            type: array
            nullable: true
            enum: [null]
            items:
              $ref: '#/components/schemas/Position'
      properties:
        warehouse_id:
          type: string
          minLength: 1
        account_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        status:
          type: string
          enum: [available, unavailable]
        as_of:
          type: object
          nullable: true
          additionalProperties: false
          required: [date, at, basis]
          properties:
            date:
              type: string
              format: date
            at:
              type: string
              format: date-time
              x-go-type: string
              nullable: true
            basis:
              type: string
              enum: [broker_effective, source_fetched]
              description: Broker-effective time or the time the source fetched holdings.
        reason:
          type: string
          nullable: true
          enum: [not_reported, incomplete, conflict, identity_unresolved]
        positions:
          allOf:
          - type: array
            nullable: true
            items:
              $ref: '#/components/schemas/Position'
      description: Available requires as_of, null reason and an array (possibly empty). Unavailable requires a reason and null positions. The as-of time may be unknown when unavailable.
    Publication:
      type: object
      additionalProperties: false
      required: [warehouse_id, version]
      properties:
        warehouse_id:
          type: string
          minLength: 1
          maxLength: 256
        version:
          type: string
          minLength: 1
          maxLength: 256
    Money:
      type: object
      additionalProperties: false
      properties:
        amount:
          $ref: '#/components/schemas/Decimal'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      required:
      - amount
      - currency
      description: Exact validated decimal text; trailing zeros are significant source precision. No binary float
        conversion.
    Amount:
      type: object
      additionalProperties: false
      properties:
        amount:
          $ref: '#/components/schemas/NullableDecimal'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      required:
      - amount
      - currency
      description: Known currency; null amount is unknown and differs from zero.
    Quantity:
      type: object
      additionalProperties: false
      properties:
        value:
          $ref: '#/components/schemas/Decimal'
        unit:
          type: string
          enum:
          - shares
          - contracts
          - nominal
          - units
      required:
      - value
      - unit
    Reference:
      type: object
      additionalProperties: false
      properties:
        authority:
          type: string
        kind:
          type: string
        scope:
          type: string
        value:
          type: string
      required:
      - authority
      - kind
      - scope
      - value
      description: Qualified reported relationship identity, never an unqualified Wake resource ID.
    Identifier:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
        value:
          type: string
      required:
      - kind
      - value
    Charge:
      type: object
      additionalProperties: false
      description: A reported monetary role with an optional total and independently reported components. Components need not sum to the total. Separate postings are not combined.
      properties:
        role:
          type: string
        category:
          type: string
          enum:
          - commission
          - broker-execution-fee
          - broker-clearing-fee
          - third-party-execution-fee
          - third-party-clearing-fee
          - regulatory-fee
          - transaction-fee
          - fee
          - tax
          - sales-tax
          - other-tax
          - other-fee
        total:
          $ref: '#/components/schemas/NullableMoney'
        components:
          type: array
          items:
            $ref: '#/components/schemas/Charge'
      required:
      - role
      - category
      - total
      - components
    Relationship:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
        target_id:
          type: string
          nullable: true
        reported_target:
          $ref: '#/components/schemas/NullableReference'
      required:
      - kind
      - target_id
      - reported_target
      description: Explicit relationships only. Null target_id means unresolved; retain reported_target
        when supplied. Multiple targets remain separate entries.
    Deliverable:
      type: object
      additionalProperties: false
      properties:
        security:
          $ref: '#/components/schemas/NullableReference'
        quantity:
          $ref: '#/components/schemas/NullableDecimal'
        cash:
          $ref: '#/components/schemas/NullableMoney'
      required:
      - security
      - quantity
      - cash
    InstrumentTerms:
      oneOf:
      - $ref: '#/components/schemas/EquityTerms'
      - $ref: '#/components/schemas/FundTerms'
      - $ref: '#/components/schemas/OptionTerms'
      - $ref: '#/components/schemas/DebtTerms'
      - $ref: '#/components/schemas/UnclassifiedTerms'
      discriminator:
        propertyName: family
        mapping:
          equity: '#/components/schemas/EquityTerms'
          fund: '#/components/schemas/FundTerms'
          option: '#/components/schemas/OptionTerms'
          debt: '#/components/schemas/DebtTerms'
          unclassified: '#/components/schemas/UnclassifiedTerms'
    EquityTerms:
      type: object
      additionalProperties: false
      required:
      - family
      properties:
        family:
          type: string
          enum:
          - equity
    FundTerms:
      type: object
      additionalProperties: false
      required:
      - family
      properties:
        family:
          type: string
          enum:
          - fund
    OptionTerms:
      type: object
      additionalProperties: false
      required:
      - family
      - right
      - expiry
      - multiplier
      - effective_from
      - strike
      - deliverables
      properties:
        family:
          type: string
          enum:
          - option
        right:
          type: string
          nullable: true
          enum:
          - put
          - call
          - null
        expiry:
          $ref: '#/components/schemas/NullableCivilDate'
        multiplier:
          $ref: '#/components/schemas/NullableDecimal'
        effective_from:
          $ref: '#/components/schemas/NullableCivilDate'
        strike:
          $ref: '#/components/schemas/NullableMoney'
        deliverables:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Deliverable'
          description: Null means unreported. An array contains established deliverables.
    DebtTerms:
      type: object
      additionalProperties: false
      required:
      - family
      - type
      - currency
      - maturity
      - issue_date
      - dated_date
      - payments_per_year
      - coupon_rate
      properties:
        family:
          type: string
          enum:
          - debt
        type:
          type: string
          nullable: true
          enum:
          - treasury-bill
          - treasury-note
          - treasury-bond
          - conventional-gilt
          - null
        currency:
          $ref: '#/components/schemas/NullableCurrencyCode'
        maturity:
          $ref: '#/components/schemas/NullableCivilDate'
        issue_date:
          $ref: '#/components/schemas/NullableCivilDate'
        dated_date:
          $ref: '#/components/schemas/NullableCivilDate'
        payments_per_year:
          type: integer
          format: int64
          nullable: true
        coupon_rate:
          allOf:
          - $ref: '#/components/schemas/NullableDecimal'
          description: Exact annual percentage points, for example 4.125 represents 4.125 percent.
    UnclassifiedTerms:
      type: object
      additionalProperties: false
      required:
      - family
      properties:
        family:
          type: string
          enum:
          - unclassified
    Account:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        currency:
          $ref: '#/components/schemas/NullableCurrencyCode'
      required:
      - name
      - currency
    Instrument:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
        ticker:
          type: string
          nullable: true
        figi:
          type: string
          nullable: true
        underlier_id:
          type: string
          nullable: true
        family:
          type: string
          enum:
          - equity
          - fund
          - option
          - debt
          - unknown
        reference_status:
          type: string
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
        figi_allocation:
          description: Allocation of the accepted FIGI. Equity/fund roots use share_class, supported equity options use composite, debt issues use instrument.
