      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
        status:
          type: string
        target_ids:
          type: array
          items:
            type: string
        replacement_ids:
          type: array
          items:
            type: string
      required:
      - kind
      - status
      - target_ids
      - replacement_ids
    Decision:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        scope:
          type: string
        action:
          type: string
      required:
      - id
      - scope
      - action
    FieldDetail:
      type: object
      additionalProperties: false
      required: [path, reason, expectation, interpretation]
      properties:
        path:
          type: string
          pattern: '^/'
          description: JSON Pointer relative to the activity body.
        reason:
          type: string
          enum: [not_reported, reported_unavailable, unresolved, not_applicable, operator_withheld]
        expectation:
          type: string
          nullable: true
          enum: [expected, not_expected, null]
        interpretation:
          type: string
          nullable: true
          description: Registered source interpretation version that established the expectation.
    Explanation:
      type: object
      additionalProperties: false
      properties:
        calculation_rule:
          type: string
          description: Rule version applied to the retained financial inputs.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDetail'
        reported_realized_pnl:
          type: object
          additionalProperties: false
          properties:
            rule:
              type: string
            selection:
              type: string
              enum:
              - automatic
              - operator
            conflict:
              type: boolean
          required:
          - rule
          - selection
          - conflict
        identity:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            figi:
              type: string
              nullable: true
            allocation:
              type: string
              nullable: true
            reason:
              type: string
              nullable: true
            rule:
              type: string
          required:
          - figi
          - allocation
          - reason
          - rule
        id:
          type: string
        kind:
          type: string
        revision:
          type: integer
          format: int64
        selection:
          type: string
        conflict:
          type: boolean
        corrections:
          type: array
          items:
            $ref: '#/components/schemas/Correction'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
      required:
      - fields
      - identity
      - id
      - kind
      - revision
      - selection
      - conflict
      - corrections
      - decisions
      description: Compact accepted selection, active operator choices and source correction/conflict state for
        this exact resource revision. No raw reports, private evidence traversal, credentials or configuration.
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - invalid_request
          - not_found
          - stale_revision
          - method_not_allowed
          - internal_error
          - history_updating
        message:
          type: string
      required:
      - code
      - message
    NullableMoney:
      type: object
      additionalProperties: false
      properties:
        amount:
          $ref: '#/components/schemas/Decimal'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      required:
      - amount
      - currency
      description: Exact validated decimal text; trailing zeros are significant source precision. No binary float
        conversion.
      nullable: true
    NullableReference:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        authority:
          type: string
        kind:
          type: string
        scope:
          type: string
        value:
          type: string
      required:
      - authority
      - kind
      - scope
      - value
      description: Qualified reported relationship identity, never an unqualified Wake resource ID.
    FinancialSnapshot:
      type: object
      additionalProperties: false
      properties:
        warehouse_id:
          type: string
          minLength: 1
          maxLength: 256
        version:
          type: string
          minLength: 1
          maxLength: 256
          description: Opaque publication version; compare for equality only.
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
          description: Complete accepted set, including cancelled or superseded activities. Each kind/id
            occurs once.
      required:
      - warehouse_id
      - version
      - resources
    NullableRealizedPnL:
      type: object
      nullable: true
      additionalProperties: false
      description: Source-reported result for this activity, independent of corrected trade terms or reconstructed
        lots. Null means no linked result. Amount and allocated cost retain their own currencies and source dates
        and may be unknown. Reporting currency need not equal trade-price currency. These values are not period
        totals or tax calculations.
      properties:
        amount:
          $ref: '#/components/schemas/NullableMoney'
        cost_basis:
          $ref: '#/components/schemas/NullableMoney'
        report_date:
          $ref: '#/components/schemas/NullableCivilDate'
        cost_basis_report_date:
          $ref: '#/components/schemas/NullableCivilDate'
        conflict:
          type: boolean
        selection:
          type: string
          enum:
          - automatic
          - operator
      required:
      - amount
      - cost_basis
      - report_date
      - cost_basis_report_date
      - conflict
      - selection
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    revision:
      name: revision
      in: query
      required: true
      description: The mirrored resource revision. A different current revision returns stale_revision.
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    Unauthorized:
      description: Missing, malformed, invalid or revoked client token. No financial response is served.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        text/plain:
          schema:
            type: string
    Unavailable:
      description: Retained history is being updated (JSON history_updating), or client access is temporarily
        unavailable because authentication storage failed or concurrent request limits were reached (plain text).
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        text/plain:
          schema:
            type: string
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      description: 'Structured error: 400 invalid request, 404 absent resource, 405 unsupported method,
        409 stale explanation revision, 500 safe internal failure.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
