openapi: 3.0.3
info:
  title: Wake accepted financial model
  version: 1.0.0
  description: 'GET-only HTTP over the private mode-0600 Unix socket, restricted to the daemon UID. All
    responses are finite JSON. Opaque versioned cursors bind warehouse, publishing generation and position/purpose;
    never edit or invent them. Bootstrap: checkpoint BEFORE scanning all four collections, then replay
    from it to one fixed through cursor. Upsert only equal/newer revisions while retaining every delivered
    transition. Current pages order by stable ID and are not a held snapshot. Persist mirror, cursor and
    through atomically. Changes require cursor; omit through to capture a new high-water mark, then repeat
    that returned through until more=false. Empty final pages advance cursor to through. No pruning within
    a generation. Restart/companion recovery retains cursors. New rebuild/recreated warehouse invalidates
    cursors (409 cursor_invalidated); rebuild or failed/paused rebuild rejects reads (503 rebuild_in_progress).
    Bootstrap afresh explicitly after success. Malformed/wrong-purpose/future cursors return 400 malformed_cursor;
    never silently reset. Unknown values are explicit null, distinct from decimal zero. Unknown parameters,
    duplicate parameters and mutation methods are rejected. Raw evidence and operational interfaces are
    excluded.'
