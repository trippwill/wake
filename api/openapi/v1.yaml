openapi: 3.0.3
info:
  title: Wake accepted financial model
  version: 1.0.0
  description: GET-only HTTP over the private mode-0600 Unix socket, restricted to the daemon UID. GET
    /v1/snapshot returns the complete accepted resource set, warehouse identity and an opaque publication
    version. GET /v1/events streams coalesced publication notifications; reconnect announces current state.
    Compare versions for equality only. ETag and If-None-Match support unchanged conditional
    reads. Each finite response is materialized from one consistent read, released before client I/O. Validate
    the complete response before atomically replacing a mirror and its version. Failed downloads or writes
    preserve the previous mirror. A different warehouse installs a clearly reported new baseline. Individual
    resource lookups and revision-bound explanations remain available; a changed explanation revision
    returns stale_revision. Current-state synchronization does not retain intermediate delivery transitions.
    Retired instrument/listing lookups redirect to their current IDs; explanations for retired IDs
    return stale_revision. Instrument resources describe identity; financial terms belong to activity.
    Reported account positions have a separate versioned read and positions events, and are excluded
    from the financial snapshot. Unknown values are explicit null, distinct from decimal zero. Unknown or duplicate parameters and
    mutation methods are rejected. Raw evidence, credentials and operational interfaces are excluded.
paths:
  /v1/events:
    get:
      operationId: publicationEvents
      description: |
        Long-lived SSE notifications of independently versioned financial views. The server subscribes before
        its initial metadata read. A publication event is sent immediately and after accepted changes;
        bursts may coalesce. JSON data contains warehouse_id and the opaque snapshot version.
        Compare versions for equality only. An event is a refresh hint, never an acknowledgement
        that the client has synchronized. Fetch and validate a snapshot before committing a mirror
        and its version. A fetched snapshot may already be newer than the notification.
        Reconnects announce current publication; intermediate transitions are not replayed.
        No SSE id fields are sent; Last-Event-ID is ignored and provides no replay semantics.
        Comment heartbeats are sent every 15 seconds without reading storage. Consumers should
        detect absent heartbeats and reconnect with bounded backoff. Stream errors after headers
        close the connection. Disconnect and daemon shutdown release the subscription.
        A separate event: positions carries a PositionsPublication object for each account's
        positions view. Current positions metadata is announced on connection/reconnect, including
        unavailable views; changes to position content or availability produce refresh hints.
        Positions-only changes do not emit publication events. Shared identity changes may affect
        both views. Each event type has its own version; never compare versions across views.
        Consumers uninterested in an event type ignore it. Positions hints have the same coalescing,
        heartbeat and no-replay semantics. Fetch positions conditionally before acknowledging its
        version; a response may already be newer than the hint.
        No query parameters or request body are accepted.
      responses:
        '200':
          description: |
            UTF-8 SSE frames: event: publication followed by data: containing a Publication
            JSON object and a blank line. Colon-prefixed comment frames are heartbeats.
          content:
            text/event-stream:
              schema:
                type: string
              example: "event: publication\ndata: {\"warehouse_id\":\"warehouse\",\"version\":\"opaque-version\"}\n\n"
        '400':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/accounts/{id}/positions:
    get:
      operationId: accountPositions
      description: |
        Latest accepted reported position set for one account, independently versioned and excluded
        from the financial snapshot. One effective time applies to the entire set. Date-only evidence
        has a null timestamp. Quantities are signed (positive long, negative short); costs are reported
        aggregate amounts in their original currency. No holdings or cost reconstruction is performed.
        An available empty set is []; unavailable rows are null with an explicit reason. Newer
        unusable evidence withholds the set without falling back to older positions. Acquisition
        failures alone do not erase established state. Source generation/retrieval times do not
        establish revision authority. Resolve instrument IDs through the existing resource lookups.
        The opaque version is scoped to this warehouse and account. Compare for equality only;
        ETag/If-None-Match apply to available and unavailable views. Unknown/duplicate parameters,
        request bodies and mutation methods are rejected. Reads are materialized before client I/O.
      parameters:
      - $ref: '#/components/parameters/id'
      - in: header
        name: If-None-Match
        schema:
          type: string
      responses:
        '200':
          description: Current available or unavailable position view
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionsView'
        '304':
          description: This account's positions view is unchanged
          headers:
            ETag:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/accounts/{id}:
    get:
      operationId: getAccounts
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/accounts/{id}/explanation:
    get:
      operationId: explainAccounts
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/revision'
      responses:
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/instruments/{id}:
    get:
      operationId: getInstruments
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '308':
          description: Retired identity; follow Location to the current resource. No old explanation revision is transferred.
          headers:
            Location:
              required: true
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/instruments/{id}/explanation:
    get:
      operationId: explainInstruments
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/revision'
      responses:
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/listings/{id}:
    get:
      operationId: getListings
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '308':
          description: Retired identity; follow Location to the current resource. No old explanation revision is transferred.
          headers:
            Location:
              required: true
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/listings/{id}/explanation:
    get:
      operationId: explainListings
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/revision'
      responses:
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/activity/{id}:
    get:
      operationId: getActivity
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/activity/{id}/explanation:
    get:
      operationId: explainActivity
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/revision'
      responses:
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/snapshot:
    get:
      operationId: snapshot
      description: One consistent complete accepted resource set. Transactions are released before client
        I/O. Version is opaque and scoped to the warehouse identity.
      parameters:
      - in: header
        name: If-None-Match
        schema:
          type: string
        description: A previous ETag; weak validators and lists are supported.
      responses:
        '200':
          description: Complete accepted state
          headers:
            ETag:
              schema:
                type: string
              description: Quoted opaque publication version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialSnapshot'
        '304':
          description: Accepted state is unchanged
          headers:
            ETag:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
components:
  schemas:
    PositionsPublication:
      type: object
      additionalProperties: false
      required: [warehouse_id, account_id, version]
      properties:
        warehouse_id:
          type: string
          minLength: 1
        account_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
    Position:
      type: object
      additionalProperties: false
      required: [instrument_id, quantity, side, cost_basis, option, debt]
      properties:
        instrument_id:
          type: string
          minLength: 1
        quantity:
          $ref: '#/components/schemas/Quantity'
        side:
          type: string
          enum: [long, short]
        cost_basis:
          $ref: '#/components/schemas/NullableMoney'
        option:
          $ref: '#/components/schemas/NullableOption'
        debt:
          $ref: '#/components/schemas/NullableDebt'
    PositionsView:
      type: object
      additionalProperties: false
      required: [warehouse_id, account_id, version, status, as_of, reason, positions]
      oneOf:
      - type: object
        properties:
          status:
            type: string
            enum: [available]
          as_of:
            type: object
          reason:
            type: string
            nullable: true
            enum: [null]
          positions:
            type: array
            items:
              $ref: '#/components/schemas/Position'
      - type: object
        properties:
          status:
            type: string
            enum: [unavailable]
          reason:
            type: string
          positions:
            type: array
            nullable: true
            enum: [null]
            items:
              $ref: '#/components/schemas/Position'
      properties:
        warehouse_id:
          type: string
          minLength: 1
        account_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        status:
          type: string
          enum: [available, unavailable]
        as_of:
          type: object
          nullable: true
          additionalProperties: false
          required: [date, at]
          properties:
            date:
              type: string
              format: date
            at:
              type: string
              format: date-time
              x-go-type: string
              nullable: true
        reason:
          type: string
          nullable: true
          enum: [not_reported, incomplete, conflict, identity_unresolved]
        positions:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Position'
      description: Available requires as_of, null reason and an array (possibly empty). Unavailable requires a reason and null positions. Effective time may be unknown when unavailable.
    Publication:
      type: object
      additionalProperties: false
      required: [warehouse_id, version]
      properties:
        warehouse_id:
          type: string
          minLength: 1
          maxLength: 256
        version:
          type: string
          minLength: 1
          maxLength: 256
    Money:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: string
        currency:
          type: string
      required:
      - amount
      - currency
      description: Exact validated decimal text; trailing zeros are significant source precision. No binary
        float conversion.
    Amount:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: string
          nullable: true
        currency:
          type: string
      required:
      - amount
      - currency
      description: Known currency; null amount is unknown and differs from zero.
    Quantity:
      type: object
      additionalProperties: false
      properties:
        value:
          type: string
        unit:
          type: string
      required:
      - value
      - unit
    Reference:
      type: object
      additionalProperties: false
      properties:
        authority:
          type: string
        kind:
          type: string
        scope:
          type: string
        value:
          type: string
      required:
      - authority
      - kind
      - scope
      - value
      description: Qualified reported relationship identity, never an unqualified Wake resource ID.
    Identifier:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
        value:
          type: string
      required:
      - kind
      - value
    Charge:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
        scope:
          type: string
          enum:
          - total
          - component
        money:
          $ref: '#/components/schemas/Money'
      required:
      - role
      - scope
      - money
    Relationship:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
        target_id:
          type: string
          nullable: true
        reported_target:
          $ref: '#/components/schemas/NullableReference'
      required:
      - kind
      - target_id
      - reported_target
      description: Explicit relationships only. Null target_id means unresolved; retain reported_target
        when supplied. Multiple targets remain separate entries.
    Deliverable:
      type: object
      additionalProperties: false
      properties:
        security:
          $ref: '#/components/schemas/NullableReference'
        quantity:
          type: string
          nullable: true
        cash:
          $ref: '#/components/schemas/NullableMoney'
      required:
      - security
      - quantity
      - cash
    Option:
      type: object
      additionalProperties: false
      properties:
        right:
          type: string
          nullable: true
        expiry:
          type: string
          nullable: true
        multiplier:
          type: string
          nullable: true
        effective_from:
          type: string
          nullable: true
        strike:
          $ref: '#/components/schemas/NullableMoney'
        deliverables:
          type: array
          items:
            $ref: '#/components/schemas/Deliverable'
      required:
      - right
      - expiry
      - multiplier
      - effective_from
      - strike
      - deliverables
      description: Reported contract terms. Empty deliverables are unknown; a multiplier never implies
        stock delivery.
    Debt:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          nullable: true
        currency:
          type: string
          nullable: true
        maturity:
          type: string
          nullable: true
        issue_date:
          type: string
          nullable: true
        dated_date:
          type: string
          nullable: true
        coupon:
          type: string
          nullable: true
        payments_per_year:
          type: integer
          format: int64
          nullable: true
      required:
      - type
      - currency
      - maturity
      - issue_date
      - dated_date
      - coupon
      - payments_per_year
    Account:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        currency:
          type: string
          nullable: true
      required:
      - name
      - currency
    Instrument:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
        ticker:
          type: string
          nullable: true
        figi:
          type: string
          nullable: true
        underlier_id:
          type: string
          nullable: true
        family:
          type: string
          enum:
          - equity
          - fund
          - option
          - debt
          - unknown
        reference_status:
          type: string
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
        figi_allocation:
          description: Allocation of the accepted FIGI. Equity/fund roots use share_class, supported equity options use composite, debt issues use instrument.
          type: string
          nullable: true
          enum: [share_class, composite, instrument, null]
        reference_reason:
          description: Stable machine reason for unresolved identity or incomplete supporting metadata; independent of lookup health.
          type: string
          nullable: true
      required:
      - name
      - ticker
      - figi
      - underlier_id
      - family
      - reference_status
      - identifiers
      - figi_allocation
      - reference_reason
    Listing:
      type: object
      additionalProperties: false
      properties:
        instrument_id:
          type: string
        venue:
          type: string
          nullable: true
        ticker:
          type: string
          nullable: true
        currency:
          type: string
        figi:
          type: string
          nullable: true
      required:
      - instrument_id
      - venue
      - ticker
      - currency
      - figi
    Transfer:
      type: object
      additionalProperties: false
      properties:
        delivering_broker:
          type: string
          nullable: true
        direction:
          type: string
          enum: [in, out]
        method:
          type: string
          nullable: true
        company:
          type: string
          nullable: true
        counterparty_account:
          type: string
          nullable: true
        counterparty_name:
          type: string
          nullable: true
        report_date:
          type: string
          nullable: true
        price:
          $ref: '#/components/schemas/NullableMoney'
        position_value:
          $ref: '#/components/schemas/NullableMoney'
        reported_cost:
          $ref: '#/components/schemas/NullableMoney'
        reported_pnl:
          $ref: '#/components/schemas/NullableMoney'
      required: [delivering_broker, direction, method, company, counterparty_account, counterparty_name, report_date, price, position_value, reported_cost, reported_pnl]
    Cash:
      type: object
      additionalProperties: false
      properties:
        available_for_trading_date:
          type: string
          nullable: true
        category:
          type: string
          enum: [funding, transfer, dividend, payment-in-lieu, interest, withholding, fee, tax, adjustment, other]
        amount:
          $ref: '#/components/schemas/Money'
        reported_type:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
        report_date:
          type: string
          nullable: true
        ex_date:
          type: string
          nullable: true
        action:
          $ref: '#/components/schemas/NullableReference'
      required: [available_for_trading_date, category, amount, reported_type, description, code, report_date, ex_date, action]
    Activity:
      type: object
      additionalProperties: false
      properties:
        cash:
          $ref: '#/components/schemas/Cash'
        transfer:
          $ref: '#/components/schemas/Transfer'
        reported_realized_pnl:
          $ref: '#/components/schemas/NullableRealizedPnL'
        instrument_id:
          type: string
          nullable: true
        listing_id:
          type: string
          nullable: true
        at:
          type: string
          nullable: true
        trade_kind:
          type: string
          nullable: true
        side:
          type: string
          nullable: true
        position_effect:
          type: string
          nullable: true
        price_basis:
          description: Price unit convention for supported instruments. Null for debt; no quotation basis is asserted.
          type: string
          nullable: true
        settlement_date:
          type: string
          nullable: true
        lifecycle_kind:
          type: string
          nullable: true
        rate_base:
          type: string
          nullable: true
        family:
          type: string
          enum:
          - trade
          - lifecycle
          - conversion
          - security-transfer
          - cash
        account_id:
          type: string
        state:
          type: string
          enum:
          - accepted
          - cancelled
          - replaced
        conflict:
          type: boolean
        date:
          type: string
        order:
          $ref: '#/components/schemas/NullableReference'
        relationships:
          type: array
          items:
            $ref: '#/components/schemas/Relationship'
        quantity:
          $ref: '#/components/schemas/NullableQuantity'
        charges:
          type: array
          items:
            $ref: '#/components/schemas/Charge'
        sent:
          $ref: '#/components/schemas/NullableAmount'
        received:
          $ref: '#/components/schemas/NullableAmount'
        option:
          $ref: '#/components/schemas/NullableOption'
        debt:
          $ref: '#/components/schemas/NullableDebt'
        price:
          $ref: '#/components/schemas/NullableMoney'
        rate:
          $ref: '#/components/schemas/NullableMoney'
        gross:
          $ref: '#/components/schemas/NullableMoney'
        proceeds:
          $ref: '#/components/schemas/NullableMoney'
        net:
          $ref: '#/components/schemas/NullableMoney'
        net_with_billable:
          $ref: '#/components/schemas/NullableMoney'
        accrued_interest:
          $ref: '#/components/schemas/NullableMoney'
      required:
      - reported_realized_pnl
      - instrument_id
      - listing_id
      - at
      - trade_kind
      - side
      - position_effect
      - price_basis
      - settlement_date
      - lifecycle_kind
      - rate_base
      - family
      - account_id
      - state
      - conflict
      - date
      - order
      - relationships
      - quantity
      - charges
      - sent
      - received
      - option
      - debt
      - price
      - rate
      - gross
      - proceeds
      - net
      - net_with_billable
      - accrued_interest
      description: Selected trade, option outcome, FX conversion, security transfer or cash posting. Civil dates stay YYYY-MM-DD;
        at is nullable RFC3339 UTC with reported fractional precision including trailing zeros. Monetary
        roles are reported, never recomputed. Trade option/debt terms describe that activity independently
        of later reference refresh.
    Resource:
      oneOf:
      - $ref: '#/components/schemas/AccountResource'
      - $ref: '#/components/schemas/InstrumentResource'
      - $ref: '#/components/schemas/ListingResource'
      - $ref: '#/components/schemas/ActivityResource'
      description: Exactly one body, matching kind. Warehouse-local stable Wake identity and monotonically
        increasing resource revision. Cancellation/replacement retains the original resource.
    AccountResource:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - accounts
        revision:
          type: integer
          format: int64
          minimum: 1
        account:
          $ref: '#/components/schemas/Account'
      required:
      - id
      - kind
      - revision
      - account
    InstrumentResource:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - instruments
        revision:
          type: integer
          format: int64
          minimum: 1
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
      - id
      - kind
      - revision
      - instrument
    ListingResource:
