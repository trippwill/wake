components:
  schemas:
    Money:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: string
        currency:
          type: string
      required:
      - amount
      - currency
      description: Exact validated decimal text; trailing zeros are significant source precision. No binary
        float conversion.
    Amount:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: string
          nullable: true
        currency:
          type: string
      required:
      - amount
      - currency
      description: Known currency; null amount is unknown and differs from zero.
    Quantity:
      type: object
      additionalProperties: false
      properties:
        value:
          type: string
        unit:
          type: string
      required:
      - value
      - unit
    Reference:
      type: object
      additionalProperties: false
      properties:
        authority:
          type: string
        kind:
          type: string
        scope:
          type: string
        value:
          type: string
      required:
      - authority
      - kind
      - scope
      - value
      description: Qualified reported relationship identity, never an unqualified Wake resource ID.
    Identifier:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
        value:
          type: string
      required:
      - kind
      - value
    Charge:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
        scope:
          type: string
          enum:
          - total
          - component
        money:
          $ref: '#/components/schemas/Money'
      required:
      - role
      - scope
      - money
    Relationship:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
        target_id:
          type: string
          nullable: true
        reported_target:
          $ref: '#/components/schemas/NullableReference'
      required:
      - kind
      - target_id
      - reported_target
      description: Explicit relationships only. Null target_id means unresolved; retain reported_target
        when supplied. Multiple targets remain separate entries.
    Deliverable:
      type: object
      additionalProperties: false
      properties:
        security:
          $ref: '#/components/schemas/NullableReference'
        quantity:
          type: string
          nullable: true
        cash:
          $ref: '#/components/schemas/NullableMoney'
      required:
      - security
      - quantity
      - cash
    Option:
      type: object
      additionalProperties: false
      properties:
        right:
          type: string
          nullable: true
        expiry:
          type: string
          nullable: true
        multiplier:
          type: string
          nullable: true
        effective_from:
          type: string
          nullable: true
        strike:
          $ref: '#/components/schemas/NullableMoney'
        deliverables:
          type: array
          items:
            $ref: '#/components/schemas/Deliverable'
      required:
      - right
      - expiry
      - multiplier
      - effective_from
      - strike
      - deliverables
      description: Reported contract terms. Empty deliverables are unknown; a multiplier never implies
        stock delivery.
    Debt:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          nullable: true
        currency:
          type: string
          nullable: true
        maturity:
          type: string
          nullable: true
        issue_date:
          type: string
          nullable: true
        dated_date:
          type: string
          nullable: true
        coupon:
          type: string
          nullable: true
        payments_per_year:
          type: integer
          format: int64
          nullable: true
      required:
      - type
      - currency
      - maturity
      - issue_date
      - dated_date
      - coupon
      - payments_per_year
    Account:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        currency:
          type: string
          nullable: true
      required:
      - name
      - currency
    Instrument:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
        ticker:
          type: string
          nullable: true
        figi:
          type: string
          nullable: true
        underlier_id:
          type: string
          nullable: true
        family:
          type: string
          enum:
          - equity
          - fund
          - option
          - debt
          - unknown
        reference_status:
          type: string
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
        option:
          $ref: '#/components/schemas/NullableOption'
        debt:
          $ref: '#/components/schemas/NullableDebt'
      required:
      - name
      - ticker
      - figi
      - underlier_id
      - family
      - reference_status
      - identifiers
      - option
      - debt
    Listing:
      type: object
      additionalProperties: false
      properties:
        instrument_id:
          type: string
        venue:
          type: string
          nullable: true
        ticker:
          type: string
          nullable: true
        currency:
          type: string
        figi:
          type: string
          nullable: true
      required:
      - instrument_id
      - venue
      - ticker
      - currency
      - figi
    Activity:
      type: object
      additionalProperties: false
      properties:
        instrument_id:
          type: string
          nullable: true
        listing_id:
          type: string
          nullable: true
        at:
          type: string
          nullable: true
        trade_kind:
          type: string
          nullable: true
        side:
          type: string
          nullable: true
        position_effect:
          type: string
          nullable: true
        price_basis:
          type: string
          nullable: true
        settlement_date:
          type: string
          nullable: true
        lifecycle_kind:
          type: string
          nullable: true
        rate_base:
          type: string
          nullable: true
        family:
          type: string
          enum:
          - trade
          - lifecycle
          - conversion
        account_id:
          type: string
        state:
          type: string
          enum:
          - accepted
          - cancelled
          - replaced
        conflict:
          type: boolean
        date:
          type: string
        order:
          $ref: '#/components/schemas/NullableReference'
        relationships:
          type: array
          items:
            $ref: '#/components/schemas/Relationship'
        quantity:
          $ref: '#/components/schemas/NullableQuantity'
        charges:
          type: array
          items:
            $ref: '#/components/schemas/Charge'
        sent:
          $ref: '#/components/schemas/NullableAmount'
        received:
          $ref: '#/components/schemas/NullableAmount'
        option:
          $ref: '#/components/schemas/NullableOption'
        debt:
          $ref: '#/components/schemas/NullableDebt'
        price:
          $ref: '#/components/schemas/NullableMoney'
        rate:
          $ref: '#/components/schemas/NullableMoney'
        gross:
          $ref: '#/components/schemas/NullableMoney'
        proceeds:
          $ref: '#/components/schemas/NullableMoney'
        net:
          $ref: '#/components/schemas/NullableMoney'
        net_with_billable:
          $ref: '#/components/schemas/NullableMoney'
        accrued_interest:
          $ref: '#/components/schemas/NullableMoney'
      required:
      - instrument_id
      - listing_id
      - at
      - trade_kind
      - side
      - position_effect
      - price_basis
      - settlement_date
      - lifecycle_kind
      - rate_base
      - family
      - account_id
      - state
      - conflict
      - date
      - order
      - relationships
      - quantity
      - charges
      - sent
      - received
      - option
      - debt
      - price
      - rate
      - gross
      - proceeds
      - net
      - net_with_billable
      - accrued_interest
      description: Selected trade, option outcome or reported FX conversion. Civil dates stay YYYY-MM-DD;
        at is nullable RFC3339 UTC with reported fractional precision including trailing zeros. Monetary
        roles are reported, never recomputed. Trade option/debt terms describe that activity independently
        of later reference refresh.
    Resource:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - accounts
          - instruments
          - listings
          - activity
        revision:
          type: integer
          format: int64
          minimum: 1
        account:
          $ref: '#/components/schemas/Account'
        instrument:
          $ref: '#/components/schemas/Instrument'
        listing:
          $ref: '#/components/schemas/Listing'
        activity:
          $ref: '#/components/schemas/Activity'
      required:
      - id
      - kind
      - revision
      description: Exactly one body, matching kind. Warehouse-local stable Wake identity and monotonically
        increasing resource revision. Cancellation/replacement retains the original resource.
    Correction:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
        status:
          type: string
        target_ids:
          type: array
          items:
            type: string
        replacement_ids:
          type: array
          items:
            type: string
      required:
      - kind
      - status
      - target_ids
      - replacement_ids
    Decision:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        scope:
          type: string
        action:
          type: string
      required:
      - id
      - scope
      - action
    Explanation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
        revision:
          type: integer
          format: int64
        selection:
          type: string
        conflict:
          type: boolean
        corrections:
          type: array
          items:
            $ref: '#/components/schemas/Correction'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
      required:
      - id
      - kind
      - revision
      - selection
      - conflict
      - corrections
      - decisions
      description: Compact accepted selection, active operator choices and source correction/conflict
        state for this exact resource revision. No raw reports, private evidence traversal, credentials
        or configuration.
    ResourcePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        next:
          type: string
          nullable: true
      required:
      - items
      - next
    Checkpoint:
      type: object
      additionalProperties: false
      properties:
        cursor:
          type: string
      required:
      - cursor
    Change:
      type: object
      additionalProperties: false
      properties:
        cursor:
          type: string
        resource:
          $ref: '#/components/schemas/Resource'
      required:
      - cursor
      - resource
    ChangePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Change'
        cursor:
          type: string
        through:
          type: string
        more:
          type: boolean
      required:
      - items
      - cursor
      - through
      - more
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - invalid_request
          - malformed_cursor
          - cursor_invalidated
          - not_found
          - rebuild_in_progress
          - method_not_allowed
          - internal_error
        message:
          type: string
      required:
      - code
      - message
    NullableAmount:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        amount:
          type: string
          nullable: true
        currency:
          type: string
      required:
      - amount
      - currency
      description: Known currency; null amount is unknown and differs from zero.
    NullableDebt:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        type:
          type: string
          nullable: true
        currency:
          type: string
          nullable: true
        maturity:
          type: string
          nullable: true
        issue_date:
          type: string
          nullable: true
        dated_date:
          type: string
          nullable: true
        coupon:
          type: string
          nullable: true
        payments_per_year:
          type: integer
          format: int64
          nullable: true
      required:
      - type
      - currency
      - maturity
      - issue_date
      - dated_date
      - coupon
      - payments_per_year
    NullableMoney:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        amount:
          type: string
        currency:
          type: string
      required:
      - amount
      - currency
      description: Exact validated decimal text; trailing zeros are significant source precision. No binary
        float conversion.
    NullableOption:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        right:
          type: string
          nullable: true
        expiry:
          type: string
          nullable: true
        multiplier:
          type: string
          nullable: true
        effective_from:
          type: string
          nullable: true
        strike:
          $ref: '#/components/schemas/NullableMoney'
        deliverables:
          type: array
          items:
            $ref: '#/components/schemas/Deliverable'
      required:
      - right
      - expiry
      - multiplier
      - effective_from
      - strike
      - deliverables
      description: Reported contract terms. Empty deliverables are unknown; a multiplier never implies
        stock delivery.
    NullableQuantity:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        value:
          type: string
        unit:
          type: string
      required:
      - value
      - unit
    NullableReference:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        authority:
          type: string
        kind:
          type: string
        scope:
          type: string
        value:
          type: string
      required:
      - authority
      - kind
      - scope
      - value
      description: Qualified reported relationship identity, never an unqualified Wake resource ID.
  parameters:
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 2048
    changeCursor:
      name: cursor
      in: query
      required: true
