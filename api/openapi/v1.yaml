openapi: 3.0.3
info:
  title: Wake accepted financial model
  version: 1.0.0
  description: GET-only HTTP over the private mode-0600 Unix socket, restricted to the daemon UID. GET
    /v1/snapshot returns the complete accepted resource set, warehouse identity and an opaque publication
    version. Compare versions for equality only. ETag and If-None-Match support unchanged conditional
    reads. Each response is materialized from one consistent read, released before client I/O. Validate
    the complete response before atomically replacing a mirror and its version. Failed downloads or writes
    preserve the previous mirror. A different warehouse installs a clearly reported new baseline. Individual
    resource lookups and revision-bound explanations remain available; a changed explanation revision
    returns stale_revision. Current-state synchronization does not retain intermediate delivery transitions.
    Retired instrument/listing lookups redirect to their current IDs; explanations for retired IDs
    return stale_revision. Instrument resources describe identity; financial terms belong to activity.
    Unknown values are explicit null, distinct from decimal zero. Unknown or duplicate parameters and
    mutation methods are rejected. Raw evidence, credentials and operational interfaces are excluded.
paths:
  /v1/accounts/{id}:
    get:
      operationId: getAccounts
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/accounts/{id}/explanation:
    get:
      operationId: explainAccounts
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/revision'
      responses:
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/instruments/{id}:
    get:
      operationId: getInstruments
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '308':
          description: Retired identity; follow Location to the current resource. No old explanation revision is transferred.
          headers:
            Location:
              required: true
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/instruments/{id}/explanation:
    get:
      operationId: explainInstruments
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/revision'
      responses:
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/listings/{id}:
    get:
      operationId: getListings
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '308':
          description: Retired identity; follow Location to the current resource. No old explanation revision is transferred.
          headers:
            Location:
              required: true
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/listings/{id}/explanation:
    get:
      operationId: explainListings
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/revision'
      responses:
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/activity/{id}:
    get:
      operationId: getActivity
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/activity/{id}/explanation:
    get:
      operationId: explainActivity
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/revision'
      responses:
        '200':
          description: Successful finite read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/snapshot:
    get:
      operationId: snapshot
      description: One consistent complete accepted resource set. Transactions are released before client
        I/O. Version is opaque and scoped to the warehouse identity.
      parameters:
      - in: header
        name: If-None-Match
        schema:
          type: string
        description: A previous ETag; weak validators and lists are supported.
      responses:
        '200':
          description: Complete accepted state
          headers:
            ETag:
              schema:
                type: string
              description: Quoted opaque publication version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialSnapshot'
        '304':
          description: Accepted state is unchanged
          headers:
            ETag:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
components:
  schemas:
    Money:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: string
        currency:
          type: string
      required:
      - amount
      - currency
      description: Exact validated decimal text; trailing zeros are significant source precision. No binary
        float conversion.
    Amount:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: string
          nullable: true
        currency:
          type: string
      required:
      - amount
      - currency
      description: Known currency; null amount is unknown and differs from zero.
    Quantity:
      type: object
      additionalProperties: false
      properties:
        value:
          type: string
        unit:
          type: string
      required:
      - value
      - unit
    Reference:
      type: object
      additionalProperties: false
      properties:
        authority:
          type: string
        kind:
          type: string
        scope:
          type: string
        value:
          type: string
      required:
      - authority
      - kind
      - scope
      - value
      description: Qualified reported relationship identity, never an unqualified Wake resource ID.
    Identifier:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
        value:
          type: string
      required:
      - kind
      - value
    Charge:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
        scope:
          type: string
          enum:
          - total
          - component
        money:
          $ref: '#/components/schemas/Money'
      required:
      - role
      - scope
      - money
    Relationship:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
        target_id:
          type: string
          nullable: true
        reported_target:
          $ref: '#/components/schemas/NullableReference'
      required:
      - kind
      - target_id
      - reported_target
      description: Explicit relationships only. Null target_id means unresolved; retain reported_target
        when supplied. Multiple targets remain separate entries.
    Deliverable:
      type: object
      additionalProperties: false
      properties:
        security:
          $ref: '#/components/schemas/NullableReference'
        quantity:
          type: string
          nullable: true
        cash:
          $ref: '#/components/schemas/NullableMoney'
      required:
      - security
      - quantity
      - cash
    Option:
      type: object
      additionalProperties: false
      properties:
        right:
          type: string
          nullable: true
        expiry:
          type: string
          nullable: true
        multiplier:
          type: string
          nullable: true
        effective_from:
          type: string
          nullable: true
        strike:
          $ref: '#/components/schemas/NullableMoney'
        deliverables:
          type: array
          items:
            $ref: '#/components/schemas/Deliverable'
      required:
      - right
      - expiry
      - multiplier
      - effective_from
      - strike
      - deliverables
      description: Reported contract terms. Empty deliverables are unknown; a multiplier never implies
        stock delivery.
    Debt:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          nullable: true
        currency:
          type: string
          nullable: true
        maturity:
          type: string
          nullable: true
        issue_date:
          type: string
          nullable: true
        dated_date:
          type: string
          nullable: true
        coupon:
          type: string
          nullable: true
        payments_per_year:
          type: integer
          format: int64
          nullable: true
      required:
      - type
      - currency
      - maturity
      - issue_date
      - dated_date
      - coupon
      - payments_per_year
    Account:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        currency:
          type: string
          nullable: true
      required:
      - name
      - currency
    Instrument:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
        ticker:
          type: string
          nullable: true
        figi:
          type: string
          nullable: true
        underlier_id:
          type: string
          nullable: true
        family:
          type: string
          enum:
          - equity
          - fund
          - option
          - debt
          - unknown
        reference_status:
          type: string
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
        figi_allocation:
          description: Allocation of the accepted FIGI. Equity/fund roots use share_class, supported equity options use composite, debt issues use instrument.
          type: string
          nullable: true
          enum: [share_class, composite, instrument, null]
        reference_reason:
          description: Stable machine reason for unresolved identity or incomplete supporting metadata; independent of lookup health.
          type: string
          nullable: true
      required:
      - name
      - ticker
      - figi
      - underlier_id
      - family
      - reference_status
      - identifiers
      - figi_allocation
      - reference_reason
    Listing:
      type: object
      additionalProperties: false
      properties:
        instrument_id:
          type: string
        venue:
          type: string
          nullable: true
        ticker:
          type: string
          nullable: true
        currency:
          type: string
        figi:
          type: string
          nullable: true
      required:
      - instrument_id
      - venue
      - ticker
      - currency
      - figi
    Activity:
      type: object
      additionalProperties: false
      properties:
        instrument_id:
          type: string
          nullable: true
        listing_id:
          type: string
          nullable: true
        at:
          type: string
          nullable: true
        trade_kind:
          type: string
          nullable: true
        side:
          type: string
          nullable: true
        position_effect:
          type: string
          nullable: true
        price_basis:
          description: Price unit convention for supported instruments. Null for debt; no quotation basis is asserted.
          type: string
          nullable: true
        settlement_date:
          type: string
          nullable: true
        lifecycle_kind:
          type: string
          nullable: true
        rate_base:
          type: string
          nullable: true
        family:
          type: string
          enum:
          - trade
          - lifecycle
          - conversion
        account_id:
          type: string
        state:
          type: string
          enum:
          - accepted
          - cancelled
          - replaced
        conflict:
          type: boolean
        date:
          type: string
        order:
          $ref: '#/components/schemas/NullableReference'
        relationships:
          type: array
          items:
            $ref: '#/components/schemas/Relationship'
        quantity:
          $ref: '#/components/schemas/NullableQuantity'
        charges:
          type: array
          items:
            $ref: '#/components/schemas/Charge'
        sent:
          $ref: '#/components/schemas/NullableAmount'
        received:
          $ref: '#/components/schemas/NullableAmount'
        option:
          $ref: '#/components/schemas/NullableOption'
        debt:
          $ref: '#/components/schemas/NullableDebt'
        price:
          $ref: '#/components/schemas/NullableMoney'
        rate:
          $ref: '#/components/schemas/NullableMoney'
        gross:
          $ref: '#/components/schemas/NullableMoney'
        proceeds:
          $ref: '#/components/schemas/NullableMoney'
        net:
          $ref: '#/components/schemas/NullableMoney'
        net_with_billable:
          $ref: '#/components/schemas/NullableMoney'
        accrued_interest:
          $ref: '#/components/schemas/NullableMoney'
      required:
      - instrument_id
      - listing_id
      - at
      - trade_kind
      - side
      - position_effect
      - price_basis
      - settlement_date
      - lifecycle_kind
      - rate_base
      - family
      - account_id
      - state
      - conflict
      - date
      - order
      - relationships
      - quantity
      - charges
      - sent
      - received
      - option
      - debt
      - price
      - rate
      - gross
      - proceeds
      - net
      - net_with_billable
      - accrued_interest
      description: Selected trade, option outcome or reported FX conversion. Civil dates stay YYYY-MM-DD;
        at is nullable RFC3339 UTC with reported fractional precision including trailing zeros. Monetary
        roles are reported, never recomputed. Trade option/debt terms describe that activity independently
        of later reference refresh.
    Resource:
      oneOf:
      - $ref: '#/components/schemas/AccountResource'
      - $ref: '#/components/schemas/InstrumentResource'
      - $ref: '#/components/schemas/ListingResource'
      - $ref: '#/components/schemas/ActivityResource'
      description: Exactly one body, matching kind. Warehouse-local stable Wake identity and monotonically
        increasing resource revision. Cancellation/replacement retains the original resource.
    AccountResource:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - accounts
        revision:
          type: integer
          format: int64
          minimum: 1
        account:
          $ref: '#/components/schemas/Account'
      required:
      - id
      - kind
      - revision
      - account
    InstrumentResource:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - instruments
        revision:
          type: integer
          format: int64
          minimum: 1
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
      - id
      - kind
      - revision
      - instrument
    ListingResource:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - listings
        revision:
          type: integer
          format: int64
          minimum: 1
        listing:
          $ref: '#/components/schemas/Listing'
      required:
      - id
      - kind
      - revision
      - listing
    ActivityResource:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - activity
        revision:
          type: integer
          format: int64
          minimum: 1
        activity:
          $ref: '#/components/schemas/Activity'
      required:
      - id
      - kind
      - revision
      - activity
    Correction:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
        status:
          type: string
        target_ids:
          type: array
          items:
            type: string
        replacement_ids:
          type: array
          items:
            type: string
      required:
      - kind
      - status
      - target_ids
      - replacement_ids
    Decision:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        scope:
          type: string
        action:
          type: string
      required:
      - id
      - scope
      - action
    Explanation:
      type: object
      additionalProperties: false
      properties:
        identity:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            figi:
              type: string
              nullable: true
            allocation:
              type: string
              nullable: true
            reason:
              type: string
              nullable: true
            rule:
              type: string
          required: [figi, allocation, reason, rule]
        id:
          type: string
        kind:
          type: string
        revision:
          type: integer
          format: int64
        selection:
          type: string
        conflict:
          type: boolean
        corrections:
          type: array
          items:
            $ref: '#/components/schemas/Correction'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
      required:
      - identity
      - id
      - kind
      - revision
      - selection
      - conflict
      - corrections
      - decisions
      description: Compact accepted selection, active operator choices and source correction/conflict
        state for this exact resource revision. No raw reports, private evidence traversal, credentials
        or configuration.
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - invalid_request
          - not_found
          - stale_revision
          - method_not_allowed
          - internal_error
        message:
          type: string
      required:
      - code
      - message
    NullableAmount:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        amount:
          type: string
          nullable: true
        currency:
          type: string
      required:
      - amount
      - currency
      description: Known currency; null amount is unknown and differs from zero.
    NullableDebt:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        type:
          type: string
          nullable: true
        currency:
          type: string
          nullable: true
        maturity:
          type: string
          nullable: true
        issue_date:
          type: string
          nullable: true
        dated_date:
          type: string
          nullable: true
        coupon:
          type: string
          nullable: true
        payments_per_year:
          type: integer
          format: int64
          nullable: true
      required:
      - type
      - currency
      - maturity
      - issue_date
      - dated_date
      - coupon
      - payments_per_year
    NullableMoney:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        amount:
          type: string
        currency:
          type: string
      required:
      - amount
      - currency
      description: Exact validated decimal text; trailing zeros are significant source precision. No binary
        float conversion.
    NullableOption:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        right:
          type: string
          nullable: true
        expiry:
          type: string
          nullable: true
        multiplier:
          type: string
          nullable: true
        effective_from:
          type: string
          nullable: true
        strike:
          $ref: '#/components/schemas/NullableMoney'
        deliverables:
          type: array
          items:
            $ref: '#/components/schemas/Deliverable'
      required:
      - right
      - expiry
      - multiplier
      - effective_from
      - strike
      - deliverables
      description: Reported contract terms. Empty deliverables are unknown; a multiplier never implies
        stock delivery.
    NullableQuantity:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        value:
          type: string
        unit:
          type: string
      required:
      - value
      - unit
    NullableReference:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        authority:
          type: string
        kind:
          type: string
        scope:
          type: string
        value:
          type: string
      required:
      - authority
      - kind
      - scope
      - value
      description: Qualified reported relationship identity, never an unqualified Wake resource ID.
    FinancialSnapshot:
      type: object
      additionalProperties: false
      properties:
        warehouse_id:
          type: string
          minLength: 1
          maxLength: 256
        version:
          type: string
          minLength: 1
          maxLength: 256
          description: Opaque publication version; compare for equality only.
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
          description: Complete accepted set, including cancelled or superseded activities. Each kind/id
            occurs once.
      required:
      - warehouse_id
      - version
      - resources
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    revision:
      name: revision
      in: query
      required: true
      description: The mirrored resource revision. A different current revision returns stale_revision.
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    Error:
      description: 'Structured error: 400 invalid request, 404 absent resource, 405 unsupported method,
        409 stale explanation revision, 500 safe internal failure.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
