version: "2"

run:
  build-tags: [browser, firefox, frontend, racefocused]

linters:
  enable:
    - errcheck
    - gocritic
    - goheader
    - gosec
    - govet
    - staticcheck
    - usestdlibvars
    - unconvert
    - wsl_v5
  exclusions:
    generated: strict
    paths:
      - ^internal/persistence/sqlite/sqlc/
  settings:
    wsl_v5:
      allow-whole-block: true
      cuddle-max-statements: 3
    goheader:
      values:
        regexp:
          notices: '^(SPDX-FileCopyrightText: [0-9]{4}(-[0-9]{4})? \S[^\n]*\n)+'
      template: |-
        {{ notices }}SPDX-License-Identifier: MPL-2.0

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
    - golines
  exclusions:
    generated: strict
    paths:
      - ^internal/persistence/sqlite/sqlc/
  settings:
    gofumpt:
      extra:
        group-params: true
    golines:
      max-len: 110
      tab-len: 2
      shorten-comments: true
      reformat-tags: true
      chain-split-dots: true
