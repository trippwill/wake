name: Wake tools and caches
description: Restore download and compiler artifacts before installing the pinned tools.
inputs:
  role:
    description: Distinct suite whose compiled artifacts are cached.
    required: true
  cold-cache:
    description: Disable cache restoration and saving for timing measurements.
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/cache@v5
      if: inputs.cold-cache != 'true'
      with:
        path: .cache/go-mod
        key: wake-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', '.config/mise.toml') }}
    - uses: actions/cache@v5
      if: inputs.cold-cache != 'true'
      with:
        path: |
          .cache/go-build
          .cache/golangci-lint
        key: wake-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.role }}-${{ hashFiles('.config/mise.toml', 'go.mod', 'go.sum') }}-${{ hashFiles('cmd/**/*.go', 'internal/**/*.go', 'internal/**/*.sql', 'internal/**/*.templ', 'financial/**/*.go', 'source/**/*.go', 'provider/**/*.go', 'testdata/**/*.go', '.golangci.yml') }}
        restore-keys: |
          wake-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.role }}-${{ hashFiles('.config/mise.toml', 'go.mod', 'go.sum') }}-
    - uses: jdx/mise-action@v4
      with:
        cache: ${{ inputs.cold-cache != 'true' }}
