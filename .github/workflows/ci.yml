name: ci

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Validation profile (standard uses the routine race suite).
        type: choice
        options: [standard, full]
        default: standard
      cold_cache:
        description: Disable caches to measure a cold run.
        type: boolean
        default: false
  pull_request:
  push:
    tags: ["*"]
    branches: ["main", "codex/simplification-integration"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.changes.outputs.full }}
    env:
      MISE_NO_HOOKS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install: false
          cache: false
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: mise run --skip-tools ci:changes >> "$GITHUB_OUTPUT"

  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MISE_NO_HOOKS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: github:mrueg/goldmark-lint aqua:lycheeverse/lychee
          cache: ${{ inputs.cold_cache != true }}
      - run: "mise run --skip-tools docs:check ::: test:ci"

  checks:
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          role: checks
          cold-cache: ${{ inputs.cold_cache || false }}
      - run: mise run source:check
      - run: "mise run check ::: build"
      - run: mise run test:provider
      - run: mise run test:socket

  behavior:
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          role: coverage
          cold-cache: ${{ inputs.cold_cache || false }}
      - run: mise run test:coverage
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: behavior-results
          path: .cache/test-results/
          if-no-files-found: error

  race:
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.profile == 'full' && 25 || 15 }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          role: race
          cold-cache: ${{ inputs.cold_cache || false }}
      - name: Run selected race suite
        env:
          RACE_TASK: ${{ (github.event_name == 'workflow_dispatch' && inputs.profile == 'full') && 'test:race' || 'test:race:focused' }}
        run: mise run "$RACE_TASK"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: race-results
          path: .cache/test-results/
          if-no-files-found: error

  browser:
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          role: browser
          cold-cache: ${{ inputs.cold_cache || false }}
      - name: Run full browser suite
        env:
          # Installed Chrome has Ubuntu's supported sandbox profile.
          WAKE_BROWSER: /usr/bin/google-chrome
        run: mise run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-browser-screenshots
          path: .cache/browser/screenshots/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results
          path: .cache/test-results/
          if-no-files-found: error

  ci:
    if: always()
    needs: [changes, markdown, checks, behavior, race, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false
          cache: false
        env:
          MISE_NO_HOOKS: "1"
      - name: Require every expected check to succeed
        env:
          MISE_NO_HOOKS: "1"
          CHANGES_RESULT: ${{ needs.changes.result }}
          MARKDOWN_RESULT: ${{ needs.markdown.result }}
          FULL_CI: ${{ needs.changes.outputs.full }}
          APPLICATION_RESULTS: ${{ format('{0},{1},{2},{3}', needs.checks.result, needs.behavior.result, needs.race.result, needs.browser.result) }}
        run: mise run --skip-tools ci:result
