name: ci

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Validation profile (standard uses the routine race suite).
        type: choice
        options: [standard, full]
        default: standard
      cold_cache:
        description: Disable caches to measure a cold run.
        type: boolean
        default: false
  pull_request:
  push:
    branches: ["main"]
  workflow_call:
    inputs:
      release:
        description: Run full verification and preserve the tested release images.
        type: boolean
        required: true
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.release && 'release-' || '' }}${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.changes.outputs.full }}
    env:
      MISE_NO_HOOKS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install: false
          cache: false
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' || inputs.release }}
        run: mise run --skip-tools ci:changes >> "$GITHUB_OUTPUT"

  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MISE_NO_HOOKS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: github:mrueg/goldmark-lint aqua:lycheeverse/lychee
          cache: ${{ inputs.cold_cache != true }}
      - run: "mise run --skip-tools docs:check ::: test:ci"
      - if: ${{ !inputs.release }}
        run: mise run docs:site:build

  checks:
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          role: checks
          cold-cache: ${{ inputs.cold_cache || false }}
      - run: mise run source:check
      - run: "mise run check ::: build"
      - run: mise run test:provider

  behavior:
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          role: coverage
          cold-cache: ${{ inputs.cold_cache || false }}
      - run: mise run test:coverage
      - run: mise run test:api
        env:
          WAKE_DEV_COVERAGE: .cache/test-results/wake-dev-coverage.txt
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.txt,.cache/test-results/wake-dev-coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: behavior-results
          path: .cache/test-results/
          if-no-files-found: error

  race:
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.release || inputs.profile == 'full') && 25 || 15 }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          role: race
          cold-cache: ${{ inputs.cold_cache || false }}
      - name: Run selected race suite
        env:
          RACE_TASK: ${{ (inputs.release || inputs.profile == 'full') && 'test:race' || 'test:race:focused' }}
        run: mise run "$RACE_TASK"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: race-results
          path: .cache/test-results/
          if-no-files-found: error

  browser:
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          role: browser-${{ matrix.engine }}
          cold-cache: ${{ inputs.cold_cache || false }}
      - name: Run full Chromium suite
        if: matrix.engine == 'chromium'
        env:
          # Installed Chrome has Ubuntu's supported sandbox profile.
          WAKE_BROWSER: /usr/bin/google-chrome
        run: mise run test:browser
      - name: Verify Firefox password and passkey sign-in
        if: matrix.engine == 'firefox'
        run: mise run test:browser:firefox
      - uses: actions/upload-artifact@v7
        if: always() && matrix.engine == 'chromium'
        with:
          name: synthetic-browser-screenshots
          path: .cache/browser/screenshots/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-${{ matrix.engine }}-results
          path: .cache/test-results/
          if-no-files-found: error

  appliance:
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      WAKE_IMAGE: localhost/wake:ci-${{ matrix.arch }}
      WAKE_IMAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          role: appliance
          cold-cache: ${{ inputs.cold_cache || false }}
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - run: "mise run release:package ::: container:build"
      - name: Verify packaged Wake
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          archive="wake-linux-$ARCH.tar.gz"
          (cd .cache/release && sha256sum --strict --check "$archive.sha256")
          destination=$(mktemp -d)
          trap 'rm -rf "$destination"' EXIT
          tar -xzf ".cache/release/$archive" -C "$destination"
          test "$(stat -c %a "$destination/wake")" = 755
          version=$("$destination/wake" --version)
          revision=$(git rev-parse HEAD)
          printf '%s\n' "$version"
          [[ $version == *"(linux/$ARCH, "*", revision $revision)" ]]
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            [[ $version == "wake version $GITHUB_REF_NAME "* ]]
          fi
          "$destination/wake" config init --config "$destination/config.toml" --generate-key --set "paths.runtime_dir=$destination/run"
          "$destination/wake" config check --config "$destination/config.toml" --check-key
      - uses: actions/upload-artifact@v7
        with:
          name: wake-linux-${{ matrix.arch }}
          path: .cache/release/wake-linux-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - run: mise run container:test
      - if: inputs.release
        run: mise run container:export
      - uses: actions/upload-artifact@v7
        if: inputs.release
        with:
          name: appliance-${{ matrix.arch }}
          path: .cache/container/wake-${{ matrix.arch }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  ci:
    if: always()
    needs: [changes, markdown, checks, behavior, race, browser, appliance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false
          cache: false
        env:
          MISE_NO_HOOKS: "1"
      - name: Require every expected check to succeed
        env:
          MISE_NO_HOOKS: "1"
          CHANGES_RESULT: ${{ needs.changes.result }}
          MARKDOWN_RESULT: ${{ needs.markdown.result }}
          FULL_CI: ${{ needs.changes.outputs.full }}
          APPLICATION_RESULTS: ${{ format('{0},{1},{2},{3},{4}', needs.checks.result, needs.behavior.result, needs.race.result, needs.browser.result, needs.appliance.result) }}
        run: mise run --skip-tools ci:result

  release-go-install:
    needs: [changes, ci]
    if: >-
      inputs.release ||
      (needs.changes.outputs.full == 'true' && github.repository == 'trippwill/wake' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        env:
          MISE_NO_HOOKS: "1"
        with:
          install_args: go
          cache: false
      - name: Install Wake from the public commit or tag
        run: |
          go_bin=$(mise which go)
          revision=$(git rev-parse HEAD)
          ref=$revision
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            ref=$GITHUB_REF_NAME
          fi
          workspace=$(mktemp -d)
          trap 'rm -rf "$workspace"' EXIT
          cd "$workspace"
          go=(env -i PATH=/usr/bin:/bin HOME="$workspace" GOBIN="$workspace/bin" CGO_ENABLED=0 GOFLAGS=-modcacherw GONOPROXY=go.trippwill.dev/wake "$go_bin")
          module="go.trippwill.dev/wake@$ref"
          resolved=$("${go[@]}" list -m -f '{{.Version}} {{.Origin.Hash}}' "$module")
          read -r expected origin <<< "$resolved"
          [[ $origin == "$revision" ]]
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            [[ $expected == "$ref" ]]
          fi
          "${go[@]}" install "$module"
          version=$(bin/wake --version)
          printf '%s\n' "$version"
          [[ $version == "wake version $expected "* ]]
          bin/wake serve --help
